name: Refresh schedules

# Operators publish new timetables every few weeks. This regenerates every bundled schedule (data/*) from the official
# GTFS feeds and opens a PR if anything changed. Add WMATA_API_KEY as a repository secret to include Washington.
# One feed failing never stops the others; its old data is kept (see the log).
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:refresh
        env:
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
      # Fail before opening a PR if the new data breaks anything.
      - run: npm test
      - id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          # PRs opened with the default GITHUB_TOKEN don't trigger CI, so required
          # checks would never report and auto-merge would stall. Set AUTOMERGE_TOKEN
          # (a fine-grained PAT with contents + pull-requests write) to fix that.
          token: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/refresh-schedules
          delete-branch: true
          commit-message: "chore: refresh bundled schedules"
          title: "chore: refresh bundled schedules"
          body: "Automated regeneration of the bundled timetables in `data/*` from the operators' GTFS feeds (`npm run data:refresh`). See the workflow run for any feed that could not be refreshed."
      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
